<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">    
        <h1>Login To We<span>School</span></h1>
        <form action="../Home/Home.html">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Username or Email"> <br><br>
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="8"  placeholder="********"> <br><br>
            <button type="submit">Login</button>
        </form>
        <p>Not Registered Yet? <a href="../Courses/courses.html">Register Now!</a></p>
    </div>
</body>
</html>
